[package]
edition = "2021"
name = "stm32wb-hci"
version = "0.1707.0"
authors = [
    "Daniel Gallagher <pdanielgallagher@gmail.com>",
    "Ghaith Oueslati <ghaith.oueslati@enis.tn>",
]
categories = ["embedded", "hardware-support", "no-std", "async"]
description = "Implementation of the Bluetooth HCI for the STM32WB family"
keywords = ["ble", "bluetooth", "stm32"]
license = "MIT/Apache-2.0"
repository = "https://github.com/OueslatiGhaith/stm32wb-hci"
readme = "README.md"
exclude = ["tests"]

[dependencies]
bitflags = "2.4.1"
byteorder = { version = "1.5.0", default_features = false }
defmt = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1.35", features = ["rt", "rt-multi-thread", "macros"] }

[features]
default = ["all-events", "all-return-parameters"]
defmt = ["dep:defmt"]

# Each HCI event and command return parameter decoder has its own feature. A disabled event decodes
# as `Event::Unparsed`, `Event::UnparsedLeMeta` or `VendorEvent::Unparsed`, and disabled return
# parameters decode as `ReturnParameters::Unparsed` or `VendorReturnParameters::Unparsed`, so
# firmware that needs only a few of them can leave out the rest of the decoding code.
all-events = [
    "event-att-error-response",
    "event-att-exchange-mtu-response",
    "event-att-execute-write-response",
    "event-att-find-by-type-value-response",
    "event-att-find-information-response",
    "event-att-prepare-write-permit-request",
    "event-att-prepare-write-response",
    "event-att-read-blob-response",
    "event-att-read-by-group-type-response",
    "event-att-read-by-type-response",
    "event-att-read-multiple-permit-request",
    "event-att-read-multiple-response",
    "event-att-read-permit-request",
    "event-att-read-response",
    "event-att-write-permit-request",
    "event-command-complete",
    "event-command-status",
    "event-connection-complete",
    "event-coprocessor-ready",
    "event-data-buffer-overflow",
    "event-disconnection-complete",
    "event-encryption-change",
    "event-encryption-key-refresh-complete",
    "event-gap-address-not-resolved",
    "event-gap-authorization-request",
    "event-gap-bond-lost",
    "event-gap-device-found",
    "event-gap-keypress-notification",
    "event-gap-limited-discoverable-timeout",
    "event-gap-numeric-comparison-value",
    "event-gap-pairing-complete",
    "event-gap-pass-key-request",
    "event-gap-peripheral-security-initiated",
    "event-gap-procedure-complete",
    "event-gatt-attribute-modified",
    "event-gatt-discover-or-read-characteristic-by-uuid-response",
    "event-gatt-eatt-brearer",
    "event-gatt-indication",
    "event-gatt-indication-ext",
