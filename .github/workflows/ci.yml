name: CI

on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
      - run: cargo build --locked --release --target=thumbv7em-none-eabihf
      - run: cargo build --locked --features=defmt --release --target=thumbv7em-none-eabihf
      - run: cargo build --locked --no-default-features --features=defmt --release --target=thumbv7em-none-eabihf

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: thumbv7em-none-eabihf
      - run: cargo localtest --locked --verbose --all
      - run: cargo localtest_unparsed --locked --verbose
